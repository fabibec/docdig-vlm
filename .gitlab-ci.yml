stages:
  - test
  - build
  - health-check
  - promote
  - deploy

variables:
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
  IMAGE_NAME: registry.vogelwarte.ch/$CI_PROJECT_PATH
  # Pinned CLI image — floating :latest broke the pipeline before.
  DOCKER_IMAGE_VERSION: "27.3.1"

# NOTE: no docker:dind service here. The runner (merops-01) mounts the host
# Docker socket into job containers (socket binding) — a dind daemon cannot
# even bind /var/run/docker.sock ("device or resource busy"). The docker CLI
# in the job talks straight to the host daemon via the mounted socket, so
# neither DOCKER_HOST nor a service is needed.

# Shared setup for jobs that use the docker CLI.
.docker:
  image: docker:$DOCKER_IMAGE_VERSION
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $IMAGE_NAME:latest || true
  tags:
    - docker

# testing

test:backend:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  timeout: 30m
  variables:
    UV_CACHE_DIR: .cache/uv
    UV_LINK_MODE: copy
    # Settings require these; tests never talk to a real LLM.
    LLM_BASE_URL: http://127.0.0.1:9
    LLM_API_KEY: ci-dummy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends poppler-utils
  script:
    - uv sync --frozen --no-group ocr
    - uv run ruff check backend
    - uv run pytest --junitxml=report.xml --cov=backend --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - main
    - testing
    - merge_requests
  tags:
    - docker

test:frontend:
  stage: test
  image: node:26.13.0-trixie-slim  # same as Dockerfile; >= 26.12.1 for CVE-2026-111497
  timeout: 30m
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run lint
    - npx ng test --watch=false
  only:
    - main
    - testing
    - merge_requests
  tags:
    - docker

# ---------- build ----------

build:
  extends: .docker
  stage: build
  timeout: 2 hours
  needs:
    - test:backend
    - test:frontend
  script:
    # Build the image with cache
    - docker build --cache-from $IMAGE_NAME:latest --build-arg BUILDKIT_INLINE_CACHE=1 -f Dockerfile -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:$CI_COMMIT_REF_SLUG

    # Tag as latest if on main branch
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:latest
      fi

    # Push all tags
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker push $IMAGE_NAME:latest
      fi
  only:
    - main
    - testing

health-check:
  extends: .docker
  stage: health-check
  timeout: 15m
  variables:
    TEST_CONTAINER: docdig-ci-$CI_JOB_ID
  script:
    # Builds share the HOST docker daemon (socket binding): unique name and no
    # published ports, so nothing clashes with the deployed containers.
    # Dummy LLM settings: the app refuses to start without them.
    - docker run -d --name $TEST_CONTAINER -e LLM_BASE_URL=http://127.0.0.1:9 -e LLM_API_KEY=ci-dummy $IMAGE_NAME:$CI_COMMIT_SHA
    # Wait for the image's own HEALTHCHECK (GET /api/health) to report healthy.
    - |
      i=1
      while [ $i -le 30 ]; do
        state=$(docker inspect -f '{{.State.Status}}' $TEST_CONTAINER)
        health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' $TEST_CONTAINER)
        echo "Attempt $i/30: state=$state health=$health"
        if [ "$state" != "running" ]; then
          echo "Container is not running, logs:"
          docker logs $TEST_CONTAINER || true
          exit 1
        fi
        if [ "$health" = "healthy" ]; then
          break
        fi
        if [ $i -eq 30 ]; then
          echo "Container did not become healthy, logs:"
          docker logs $TEST_CONTAINER || true
          exit 1
        fi
        i=$((i + 1))
        sleep 5
      done
    # Double-check the endpoint directly (the image has no curl).
    - docker exec $TEST_CONTAINER python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"
    - echo "Health check passed!"
  after_script:
    - docker rm -f $TEST_CONTAINER || true
  only:
    - main
    - testing

# ---------- promote ----------

promote_to_testing:
  extends: .docker
  stage: promote
  script:
    # Tag existing image as testing
    - docker tag $IMAGE_NAME:latest $IMAGE_NAME:testing
    # Push testing tag to registry
    - docker push $IMAGE_NAME:testing
  only:
    - testing
  when: manual

promote_to_production:
  extends: .docker
  stage: promote
  script:
    # Tag existing image as production
    - docker tag $IMAGE_NAME:latest $IMAGE_NAME:production
    # Push production tag to registry
    - docker push $IMAGE_NAME:production
  only:
    - production
  when: manual

# ---------- deploy ----------
# Host layout per environment (<env> = testing | production):
#   /opt/docdig/<env>/.env   app settings (LLM_*, ...), created by hand
#   /opt/docdig/<env>/data   mounted as /data (SQLite + batches)

deploy_testing:
  stage: deploy
  image: alpine:3.22
  timeout: 5m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Login to registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.vogelwarte.ch

        # Pull testing image
        docker pull $IMAGE_NAME:testing

        # Data dir must be writable by the container user (uid 1000).
        # chown may need root: if it fails, run it once by hand on the host.
        mkdir -p /opt/docdig/testing/data
        chown 1000:1000 /opt/docdig/testing/data || echo 'WARN: could not chown /opt/docdig/testing/data to 1000:1000'

        # Stop and remove existing testing container
        docker stop docdig-testing || true
        docker rm docdig-testing || true

        # Start new testing container on port 8502
        docker run -d --name docdig-testing -p 8502:8000 --restart unless-stopped --env-file /opt/docdig/testing/.env -v /opt/docdig/testing/data:/data $IMAGE_NAME:testing

        # Clean up old images
        docker image prune -f
      "
  environment:
    name: testing
    url: http://$DEPLOY_HOST:8502
  only:
    - testing
  when: manual

deploy_production:
  stage: deploy
  image: alpine:3.22
  timeout: 5m
  needs:
    - promote_to_production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Login to registry
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.vogelwarte.ch

        # Pull production image
        docker pull $IMAGE_NAME:production

        # Data dir must be writable by the container user (uid 1000).
        # chown may need root: if it fails, run it once by hand on the host.
        mkdir -p /opt/docdig/production/data
        chown 1000:1000 /opt/docdig/production/data || echo 'WARN: could not chown /opt/docdig/production/data to 1000:1000'

        # Stop and remove existing production container
        docker stop docdig-production || true
        docker rm docdig-production || true

        # Start new production container on port 8501
        docker run -d --name docdig-production -p 8501:8000 --restart unless-stopped --env-file /opt/docdig/production/.env -v /opt/docdig/production/data:/data $IMAGE_NAME:production

        # Clean up old images
        docker image prune -f
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST:8501
  only:
    - production
  when: manual
