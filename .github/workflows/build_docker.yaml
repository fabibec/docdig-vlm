# This workflow will build a Docker image
# and push them to a private docker registry when a release tag (i.e.: 1.0.1)
# is pushed to the repository.
#
# Adapted from: https://daniel.es/blog/automatically-build-docker-images-with-github-actions/

# Script environment variables
env:
  DOCKER_IMAGE_NAME: ${{ github.repository_owner }}/docdig-application
  DOCKER_REGISTRY: ghcr.io

name: Build and Push Docker Image

# Triggers
on:
  # Trigger the action manually from the UI
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag (leave blank to tag as latest only)'
        required: false
        type: string
  # Trigger the action when a version tag is pushed
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Push events to matching numeric semver tags, i.e., 1.0.0, 20.15.10

jobs:
  build-and-push-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: get_tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          IMAGE="$(echo "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "${IMAGE}:${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_TAG}" ]]; then
            echo "${IMAGE}:${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.get_tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.get_tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.get_tags.outputs.image }}:buildcache,mode=max
