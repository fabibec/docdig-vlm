[project]
name = "docdig"
version = "0.1.0"
description = "Digitise handwritten bird ringing forms: PDF -> table crop -> LLM extraction -> human review"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies: everything the pipeline + web app need. This is exactly what the
# Docker image installs (`uv sync --no-default-groups`), so keep heavy optional stuff out of here.
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.3",
    "genai-prices>=0.1.13",
    "granian>=2.8.5",
    "h2>=4.4.1",
    "openai>=3.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pdf2image>=1.17.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "tabulate>=0.10.0",
    "truststore>=0.10.5",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.9.1",
    "levenshtein>=0.27.5",
    "matplotlib>=3.11.2",
]
# Local OCR step, never part of the Docker image.
ocr = [
    "rapidfuzz>=3.14.6",
    "pytesseract>=0.3.13",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
]

[tool.uv]
# Supply-chain cooldown: ignore package versions published in the last 7 days.
exclude-newer = "7 days"
# Plain `uv sync` locally installs everything (as before); Docker uses `--no-default-groups`.
default-groups = ["dev", "ocr"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "data", "models", "backend/pipeline/backup"]  # backup/ = old OCR code, kept for reference

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "ASYNC",    # blocking calls in async code
    "RUF",      # ruff-specific
]
ignore = [
    "B008",     # FastAPI: Depends()/Query() in argument defaults is the intended pattern
    "C408",     # dict(a=1) is fine for kwargs-like dicts
    "RUF001", "RUF002", "RUF003",  # typographic quotes/dashes in UI strings and comments are intentional
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy needs `== False` inside where() clauses
"backend/api/**" = ["E712"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
    "integration: exercises several components together (real files, full app)",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/pipeline/backup/*"]
# SQLAlchemy async runs route code inside greenlets; without this, lines after an await look uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]


[tool.ty.environment]
# VS Code ty otherwise resolves imports against the system Python, not the uv venv.
python = ".venv"
